<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Referee</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <div><h1>Referee</h1><p>Evidence-locked scientific review workbench</p></div>
  <div class="actions"><button id="refresh">Refresh</button><button id="finalize" disabled>Freeze handoff</button></div>
</header>
<main>
  <aside class="panel sidebar">
    <div class="panel-title"><h2>Runs</h2><span id="runCount" class="pill">0</span></div>
    <input id="filter" placeholder="Filter runs…" autocomplete="off">
    <div id="runs">Loading…</div>
  </aside>
  <section class="panel content">
    <div id="empty"><h2>Select a run</h2><p>Inspect the review summary, major concerns, evidence state, artifacts and human workflow notes.</p></div>
    <div id="workbench" hidden>
      <div class="run-head"><div><h2 id="runTitle"></h2><div id="runMeta" class="muted"></div></div><span id="runStatus" class="badge"></span></div>
      <nav class="tabs">
        <button data-tab="summary" class="active">Summary</button>
        <button data-tab="concerns">Major concerns</button>
        <button data-tab="evidence">Evidence</button>
        <button data-tab="artifacts">Artifacts</button>
        <button data-tab="notes">Notes</button>
      </nav>
      <section id="tab-summary" class="tab"></section>
      <section id="tab-concerns" class="tab" hidden></section>
      <section id="tab-evidence" class="tab" hidden></section>
      <section id="tab-artifacts" class="tab" hidden></section>
      <section id="tab-notes" class="tab" hidden></section>
    </div>
  </section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
