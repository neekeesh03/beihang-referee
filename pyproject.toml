[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beihang-referee"
version = "0.1.0"
description = "Beihang Referee: evidence-grounded agentic peer review for scientific manuscripts"
keywords = ["peer-review", "scientific-review", "research-software", "llm", "agentic-ai", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Beihang Referee contributors"}]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
validation = ["jsonschema>=4.20"]
pdf = ["PyMuPDF>=1.24"]
docx = ["python-docx>=1.1"]
office = ["python-docx>=1.1", "openpyxl>=3.1"]
scholarly = ["httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.0"]
all = ["jsonschema>=4.20", "PyMuPDF>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4.20", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
referee = "referee.cli:main"
referee-mcp = "referee.mcp.server:main"

[tool.setuptools]
packages = {find = {where = ["."], include = ["referee*"]}}

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.package-data]
referee = [
  "_assets/core/*.md",
  "_assets/agents/*.md",
  "_assets/skills/*/*.md",
  "_assets/guidelines/*.md",
  "_assets/profiles/guidelines/*.json",
  "_assets/profiles/domain_packs/*.json",
  "_assets/config/defaults.json",
  "_assets/config/profiles/*.json",
  "_assets/config/benchmark_profiles/*.json",
  "_assets/config/journal_profiles/*.json",
  "_assets/frontend/*.html",
  "_assets/frontend/*.css",
  "_assets/frontend/*.js",
  "_assets/benchmark_corpus/*.jsonl",
  "_assets/benchmark_corpus/*.json",
  "_assets/benchmark_corpus/*.md",
  "_assets/schemas/*.json",
  "_assets/validation/*.json",
  "_assets/validation/*.md",
]
