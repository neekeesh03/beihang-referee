name: Build release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install release dependencies
        run: python -m pip install -e '.[dev,office,pdf,validation]'
      - name: Build validated release
        run: python scripts/build_release.py --output release-dist
      - uses: actions/upload-artifact@v6
        with:
          name: beihang-referee-release
          path: release-dist/*
          if-no-files-found: error
