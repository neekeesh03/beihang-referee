name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev,office,pdf]'
      - name: Validate source package
        run: python scripts/validate_package.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build/runtime dependencies
        run: python -m pip install -e '.[office,pdf,validation]'
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w wheelhouse
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m pip uninstall -y beihang-referee
          python -m pip install --no-deps wheelhouse/*.whl
          cd /tmp
          referee --version
          referee list-profiles
          referee list-modes
