name: Provider / integration request
description: Request a model, scholarly-search, protocol, or external integration
title: "[Integration] "
labels: [integration]
body:
  - type: input
    id: provider
    attributes:
      label: Provider or integration
      placeholder: e.g. model endpoint, search backend, protocol, service
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Why is this integration useful and which Referee workflow should use it?
    validations:
      required: true
  - type: textarea
    id: interface
    attributes:
      label: Public interface / documentation
      description: Describe the API/protocol shape. Do not include API keys or credentials.
  - type: textarea
    id: constraints
    attributes:
      label: Provenance, privacy, and reliability constraints
      description: Note rate limits, source provenance, confidentiality, offline behavior, structured-output support, or other relevant constraints.
